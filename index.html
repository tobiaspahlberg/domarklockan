<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Domarklockan</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1420">
<link rel="manifest" href="manifest.json">
<!-- Hemskärmsikon: lägg domarklockan-ikon.png i samma mapp som denna fil -->
<link rel="apple-touch-icon" href="domarklockan-ikon.png">
<link rel="icon" type="image/png" sizes="512x512" href="domarklockan-ikon.png">
<!-- Reservikon (inbäddad) som visas i webbläsarfliken även om PNG-filen saknas -->
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="%230B1420"/><rect x="58" y="232" width="278" height="90" rx="45" fill="%23FFD60A"/><circle cx="330" cy="330" r="125" fill="%23FFD60A"/><rect x="336" y="200" width="56" height="92" fill="%230B1420"/><circle cx="332" cy="340" r="40" fill="%230B1420"/><circle cx="116" cy="190" r="28" fill="none" stroke="%23FFD60A" stroke-width="16"/></svg>'>
<style>
  :root{
    --bg:#0B1420;
    --surface:#14202F;
    --surface-2:#1B2A3C;
    --line:#26374B;
    --text:#F5F7F4;
    --dim:#8FA0B3;
    --run:#FFD60A;      /* klockan går */
    --over:#FF6B35;     /* tilläggstid */
    --go:#35C46A;       /* start */
    --stop:#E5484D;     /* larm/stopp */
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow:hidden;
  }
  .screen{flex:1;display:none;flex-direction:column;min-height:0}
  .screen.active{display:flex}

  /* ---------- STARTSKÄRM ---------- */
  #start{padding:20px 16px;overflow-y:auto}
  .brand{
    position:relative;overflow:hidden;flex-shrink:0;
    background:linear-gradient(135deg,#005293,#003567);
    border-radius:20px;padding:22px 20px 18px;margin:4px 0 18px;
  }
  .brand h1{font-size:28px;font-weight:800;letter-spacing:-.02em;color:#fff;position:relative}
  .brand p{color:#BFD7EE;font-size:14px;margin-top:4px;max-width:30ch;position:relative}
  .ver{color:#8FB4D9;font-size:12px;margin-top:8px;position:relative}
  .pitchdeco{position:absolute;right:-34px;top:-18px;width:200px;pointer-events:none}
  .updatebanner{
    display:block;width:100%;background:var(--run);color:#241D00;
    border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:700;
    margin-bottom:14px;cursor:pointer;flex-shrink:0;
  }
  .updatebanner[hidden]{display:none}
  #formList{flex-shrink:0}

  /* Matchhistorik */
  #matchLists{flex-shrink:0}
  .mh-title{
    color:var(--dim);font-size:13px;font-weight:700;text-transform:uppercase;
    letter-spacing:.06em;margin:2px 4px 8px;
  }
  .mh-section{margin-bottom:16px}
  .mrow{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;margin-bottom:8px;
  }
  .mrow.ongoing{border-left:5px solid var(--run)}
  .minfo{flex:1;min-width:0}
  .mname{font-weight:800;font-size:16px}
  .mmeta{color:var(--dim);font-size:13px;margin-top:2px}
  .mbtn{border:none;border-radius:10px;padding:11px 14px;font-weight:800;font-size:14px;cursor:pointer}
  .mbtn.resume{background:var(--go);color:#08110B}
  .mbtn.del{background:none;border:1px solid var(--line);color:var(--dim);font-size:16px;padding:11px 12px}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:16px;margin-bottom:12px;
  }
  .card .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .card .name{font-size:20px;font-weight:800}
  .card .age{background:#FECC02;color:#00427A;font-size:12px;font-weight:800;padding:4px 12px;border-radius:999px}
  .variants{display:flex;gap:8px;flex-wrap:wrap}
  .variant{
    flex:1;min-width:120px;
    background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
    color:var(--text);padding:14px 10px;font-size:15px;font-weight:600;
    display:flex;flex-direction:column;gap:4px;align-items:center;cursor:pointer;
  }
  .variant:active{background:#243347}
  .variant .time{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
  .variant .label{font-size:12px;color:var(--dim);font-weight:500}

  /* ---------- MATCHSKÄRM ---------- */
  #match{padding:14px 16px 18px}
  .topbar{display:flex;justify-content:space-between;align-items:center}
  .backbtn{background:none;border:none;color:var(--dim);font-size:15px;padding:8px 4px;cursor:pointer}
  .formname{color:var(--dim);font-size:14px;font-weight:600}
  #infoBtn{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
    background:var(--surface-2);color:var(--run);font-size:19px;font-weight:800;cursor:pointer;
  }
  #infoBtn:active{background:#243347}

  /* Regelinfo-modal */
  #infoModal{
    position:fixed;inset:0;background:rgba(11,20,32,.88);
    display:none;justify-content:center;align-items:center;z-index:20;padding:20px;
  }
  #infoModal.active{display:flex}
  .infobox{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:20px;max-width:430px;width:100%;max-height:82vh;overflow-y:auto;
  }
  .infobox h3{font-size:21px;font-weight:800}
  .isub{color:var(--dim);font-size:13px;margin:2px 0 16px}
  .irow{margin-bottom:13px}
  .ilabel{font-weight:800;font-size:14px;color:var(--run);margin-bottom:2px}
  .itext{font-size:14px;line-height:1.5}
  .ilink{display:block;margin:16px 0 14px;color:#7FB3E8;font-size:14px;text-decoration:none}
  .iclose{
    width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
    color:var(--text);font-size:16px;font-weight:700;padding:14px;cursor:pointer;
  }

  /* Periodsegment – visar var i matchen man är */
  .periods{display:flex;gap:6px;margin:10px 0 4px}
  .pseg{flex:1;height:8px;border-radius:4px;background:var(--surface-2);position:relative;overflow:hidden}
  .pseg.done{background:var(--dim)}
  .pseg .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--run)}
  .pseg.overtime .fill{background:var(--over)}
  .plabel{text-align:center;color:var(--dim);font-size:14px;font-weight:600;margin-top:8px}

  .clockwrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:0}
  .clock{
    font-variant-numeric:tabular-nums;
    font-weight:800;letter-spacing:-.03em;line-height:1;
    font-size:clamp(72px, 26vw, 150px);
  }
  .clock.running{color:var(--run)}
  .clock.overtime{color:var(--over)}
  .clocksub{color:var(--dim);font-size:16px;font-weight:600;margin-top:8px;font-variant-numeric:tabular-nums}

  /* Ställning */
  .score{display:flex;gap:10px;margin:8px 0 14px}
  .team{
    flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:12px 10px 10px;text-align:center;cursor:pointer;
  }
  .team:active{background:var(--surface-2)}
  .team .tname{font-size:14px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .team .goals{font-size:clamp(48px,16vw,84px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .scorehint{text-align:center;color:var(--dim);font-size:12px;margin-bottom:10px}

  /* Stora knappar */
  .bigbtn{
    width:100%;border:none;border-radius:16px;padding:20px;cursor:pointer;
    font-size:22px;font-weight:800;color:#08110B;
  }
  .bigbtn.start{background:var(--go)}
  .bigbtn.pause{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
  .bigbtn.alarm{background:var(--stop);color:#fff}
  .bigbtn:active{filter:brightness(1.15)}

  /* Larm-overlay */
  #alarmOverlay{
    position:fixed;inset:0;background:rgba(11,20,32,.92);
    display:none;flex-direction:column;justify-content:center;align-items:center;
    gap:24px;padding:24px;text-align:center;z-index:10;
  }
  #alarmOverlay.active{display:flex;animation:flash 1s steps(2) infinite}
  @keyframes flash{50%{background:rgba(229,72,77,.35)}}
  #alarmOverlay h2{font-size:34px;font-weight:800}
  #alarmOverlay p{color:var(--dim);font-size:16px}
  #alarmOverlay .bigbtn{max-width:340px}

  @media (prefers-reduced-motion: reduce){
    #alarmOverlay.active{animation:none;background:rgba(229,72,77,.35)}
  }

  /* Lagfärger */
  .team{border-top:8px solid var(--line)}
  .teamrow{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:8px}
  .team .minus{
    background:none;border:1px solid var(--line);border-radius:10px;
    color:var(--dim);font-size:26px;line-height:1;width:64px;height:48px;cursor:pointer;
  }
  .colorbtn{
    width:64px;height:48px;border-radius:10px;border:1px solid var(--line);
    background:var(--surface-2);cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .colorbtn svg{width:32px;height:32px}

  /* Färgväljare */
  #colorModal{
    position:fixed;inset:0;background:rgba(11,20,32,.85);
    display:none;justify-content:center;align-items:center;z-index:20;padding:24px;
  }
  #colorModal.active{display:flex}
  .palette{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:20px;max-width:340px;width:100%;
  }
  .palette h3{font-size:17px;margin-bottom:14px;text-align:center}
  .swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .swatch{
    aspect-ratio:1;border:none;background:none;cursor:pointer;padding:2px;
  }
  .swatch svg{width:100%;height:100%}
  .swatch:active{transform:scale(.92)}

  /* Låsläge */
  #lockBtn{
    margin-top:16px;
    background:var(--surface-2);border:1px solid var(--line);border-radius:999px;
    color:var(--dim);font-size:16px;font-weight:600;padding:12px 26px;cursor:pointer;
  }
  #lockBtn:active{background:#243347}
  #lockOverlay{
    position:fixed;inset:0;z-index:15;display:none;
    background:rgba(11,20,32,.3);touch-action:none;
  }
  #lockOverlay.active{display:block}
  #lockChip{
    position:absolute;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    background:var(--run);color:#241D00;font-weight:800;font-size:16px;
    border-radius:999px;padding:9px 20px;white-space:nowrap;
  }
  #slideTrack{
    position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    width:min(340px,86vw);height:68px;border-radius:999px;
    background:var(--surface-2);border:1px solid var(--line);overflow:hidden;
  }
  #slideText{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--dim);font-size:15px;font-weight:600;padding-left:36px;
  }
  #slideKnob{
    position:absolute;left:5px;top:4px;width:58px;height:58px;border-radius:50%;
    background:var(--run);display:flex;align-items:center;justify-content:center;
    font-size:24px;touch-action:none;cursor:grab;
  }
  #slideKnob.snap{transition:left .25s ease}
</style>
</head>
<body>

<!-- STARTSKÄRM: välj spelform -->
<div id="start" class="screen active">
  <div class="brand">
    <svg class="pitchdeco" viewBox="0 0 200 140" aria-hidden="true">
      <g stroke="#FFFFFF" stroke-width="2" fill="none" opacity=".3">
        <rect x="10" y="10" width="180" height="120" rx="4"/>
        <line x1="100" y1="10" x2="100" y2="130"/>
        <circle cx="100" cy="70" r="24"/>
        <rect x="10" y="45" width="26" height="50"/>
      </g>
      <circle cx="150" cy="48" r="15" fill="#FECC02"/>
      <path d="M150 38l7 5-2.7 8.5h-8.6L143 43z" fill="#005293"/>
    </svg>
    <h1>Domarklockan</h1>
    <p>Välj spelform – speltider enligt Svensk fotbolls nationella spelformer</p>
    <p class="ver" id="verLabel"></p>
  </div>
  <button id="updateBanner" class="updatebanner" hidden></button>
  <div id="matchLists"></div>
  <div id="formList"></div>
</div>

<!-- MATCHSKÄRM -->
<div id="match" class="screen">
  <div class="topbar">
    <button class="backbtn" id="btnBack">‹ Byt spelform</button>
    <span class="formname" id="formName"></span>
    <button id="infoBtn" title="Regler för spelformen">?</button>
  </div>

  <div class="periods" id="periodSegs"></div>
  <div class="plabel" id="periodLabel"></div>

  <div class="clockwrap">
    <div class="clock" id="clock">00:00</div>
    <div class="clocksub" id="clockSub"></div>
    <button id="lockBtn">🔓 Lås skärmen</button>
  </div>

  <div class="score">
    <div class="team" id="homeTeam">
      <div class="tname">Hemma</div>
      <div class="goals" id="homeGoals">0</div>
      <div class="teamrow">
        <button class="minus" id="homeMinus">−</button>
        <button class="colorbtn" id="homeColor" title="Välj tröjfärg"></button>
      </div>
    </div>
    <div class="team" id="awayTeam">
      <div class="tname">Borta</div>
      <div class="goals" id="awayGoals">0</div>
      <div class="teamrow">
        <button class="minus" id="awayMinus">−</button>
        <button class="colorbtn" id="awayColor" title="Välj tröjfärg"></button>
      </div>
    </div>
  </div>
  <div class="scorehint">Tryck på laget för mål · − ångrar</div>

  <button class="bigbtn start" id="btnMain">Starta period 1</button>
</div>

<!-- LARM -->
<!-- LÅST LÄGE: fångar alla tryck, svep för att låsa upp -->
<div id="lockOverlay">
  <div id="lockChip">🔒 Skärmen är låst</div>
  <div id="slideTrack">
    <div id="slideText">Dra för att låsa upp&nbsp;→</div>
    <div id="slideKnob">🔓</div>
  </div>
</div>

<!-- REGELINFO -->
<div id="infoModal">
  <div class="infobox">
    <h3 id="infoTitle"></h3>
    <div class="isub" id="infoSub"></div>
    <div id="infoList"></div>
    <a class="ilink" href="https://aktiva.svenskfotboll.se/tranare/spelformer/" target="_blank" rel="noopener">Fullständiga regler på svenskfotboll.se →</a>
    <button class="iclose" id="infoClose">Stäng</button>
  </div>
</div>

<!-- FÄRGVÄLJARE -->
<div id="colorModal">
  <div class="palette">
    <h3 id="paletteTitle">Välj tröjfärg</h3>
    <div class="swatches" id="swatches"></div>
  </div>
</div>

<!-- LARM -->
<div id="alarmOverlay">
  <h2 id="alarmTitle">Perioden är slut!</h2>
  <p id="alarmSub"></p>
  <button class="bigbtn alarm" id="btnDismiss">Stäng av larmet</button>
</div>

<script>
/* ================= VERSION =================
   Höj detta nummer varje gång en ny version laddas upp!
   Appen jämför sitt eget nummer med det som ligger på servern
   och visar en uppdateringsknapp om de skiljer sig. */
const APP_VERSION = "1.7.0";

/* ================= SPELFORMER =================
   Speltider från svenskfotboll.se (nationella spelformer) */
const FORMS = [
  { name:"3 mot 3",  age:"6–7 år",
    variants:[{label:"Match", periods:4, min:3}],
    info:[
      ["Spelplan & boll","15 × 10–12 m – använd sarg om det finns. Mål max 1,6 × 1,15 m. Bollstorlek 3."],
      ["Spelare","Tre per lag, ingen målvakt. Fria byten."],
      ["Fasta situationer","Avspark, sidlinjespark, hörna och frispark sätts alla igång genom att driva eller passa bollen längs marken. Motståndarna håller 3 m avstånd. Allt är indirekt – bollen får inte skjutas direkt i mål. Straff och inkast används inte."],
      ["Kort","Gula och röda kort används inte. Vid olämpligt uppträdande byts spelaren av."],
      ["4-målsregeln","Ligger ett lag under med fyra mål eller mer får det sätta in en extra spelare (fyra) tills ställningen är utjämnad."]
    ]},
  { name:"5 mot 5",  age:"8–9 år",
    variants:[{label:"Enskild match", periods:3, min:15},
              {label:"Sammandrag",    periods:3, min:10}],
    info:[
      ["Spelplan & boll","30 × 15–20 m. Mål 3 × 1,5 m. Bollstorlek 3."],
      ["Spelare","Fyra utespelare och en målvakt per lag. Fria byten."],
      ["Retreatlinje","Mittlinjen. När målvakten gör utkast eller fångar bollen i spel backar motståndarna till sin egen planhalva och stannar där tills målvakten satt bollen i spel – genom att rulla ut den eller lägga ner den och passa längs marken."],
      ["Fasta situationer","Sätts igång genom att driva eller passa längs marken, motståndarna håller 5 m avstånd. Allt är indirekt. Straff och inkast används inte, och inga kort delas ut."],
      ["4-målsregeln","Vid underläge med fyra mål eller mer får laget spela med en extra spelare (sex) tills ställningen är utjämnad."]
    ]},
  { name:"7 mot 7",  age:"10–12 år",
    variants:[{label:"Enskild match", periods:3, min:20},
              {label:"Sammandrag",    periods:3, min:15}],
    info:[
      ["Spelplan & boll","50–55 × 30–35 m. Straffområde 19 × 7 m. Mål max 5 × 2 m. Bollstorlek 4."],
      ["Spelare","Sex utespelare och en målvakt per lag. Fria byten."],
      ["Retreatlinje","7 m från mittlinjen. När målvakten har bollen i händerna backar motståndarna bakom retreatlinjen tills spelet startas – oavsett om bollen fångats i spel eller gått ut över kortlinjen. Målvakten kan vänta tills alla backat, eller välja att spela snabbt direkt."],
      ["Frisparkar","Får slås direkt i mål. Spelarna ska hålla minst 2 m avstånd när frisparken slås."],
      ["4-målsregeln","Vid underläge med fyra mål eller mer får laget spela med en extra spelare (åtta) tills ställningen är utjämnad."]
    ]},
  { name:"9 mot 9",  age:"13–14 år",
    variants:[{label:"Match", periods:3, min:25}],
    info:[
      ["Spelplan & boll","65–72 × 50–55 m. Straffområde 24 × 9 m. Mål 6 × 2,2 m. Boll: storlek 4 för 13-åringar, storlek 5 för 14-åringar."],
      ["Spelare","Åtta utespelare och en målvakt per lag. Fria byten."],
      ["Offside","Tillämpas. En spelare är i offsideposition om hen är närmare motståndarnas mållinje än både bollen och den näst sista motspelaren när bollen spelas. Gäller bara på offensiv planhalva och spelare som är aktiva i spelet."],
      ["Inspark","Bollen ligger stilla på valfri plats i straffområdet och är i spel när den sparkats och tydligt rört sig. Motståndarna håller minst 9 m avstånd."],
      ["Straffspark","Slås från 9 m."]
    ]},
  { name:"11 mot 11", age:"15 år–",
    variants:[{label:"15 år", periods:2, min:40},
              {label:"16 år och äldre", periods:2, min:45}],
    info:[
      ["Spelplan & boll","100–110 × 60–68 m. Mål 7,32 × 2,44 m. Bollstorlek 5."],
      ["Spelare","Tio utespelare och en målvakt per lag. Fria byten."],
      ["Regler","Ordinarie spelregler för fotboll gäller fullt ut – offside, inkast, straffar och kort."]
    ]},
];

/* ================= TILLSTÅND ================= */
let cfg = null;          // { name, label, periods, min }
let period = 1;          // aktuell period (1-baserad)
let elapsed = 0;         // sekunder i aktuell period
let running = false;
let alarmFired = false;  // larmet har gått för denna period
let matchOver = false;
let home = 0, away = 0;
let tickTimer = null, lastTs = 0;
let audioCtx = null, alarmTimer = null;
let wakeLock = null;
let currentId = null;    // id för matchen i lagringen
let createdAt = 0;
let teamHex = {home:null, away:null};
let lastSaveTs = 0;

/* ================= HJÄLP ================= */
const $ = id => document.getElementById(id);
const fmt = s => {
  s = Math.floor(s);
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0");
};
const fmtDate = ts => new Date(ts).toLocaleString("sv-SE",
  {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});

/* ================= LAGRING =================
   Matcher sparas i telefonens localStorage och överlever därför
   att appen stängs helt. En match försvinner bara när man själv
   tar bort den ur listan. */
const STORE_KEY = "domarklockan_matches";

function loadAll(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch(e){ return []; }
}
function saveAll(list){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(list)); }catch(e){}
}
function snapshot(){
  return { id: currentId, createdAt, savedAt: Date.now(),
    cfg, period, elapsed, running, alarmFired, matchOver, home, away,
    colors: {home: teamHex.home, away: teamHex.away} };
}
function saveCurrent(){
  if(!currentId || !cfg) return;
  const list = loadAll();
  const i = list.findIndex(m=>m.id===currentId);
  const snap = snapshot();
  if(i>=0) list[i] = snap; else list.unshift(snap);
  // Behåll max 15 avslutade matcher (pågående sparas alltid)
  const doneIds = list.filter(m=>m.matchOver).slice(15).map(m=>m.id);
  saveAll(list.filter(m=>!doneIds.includes(m.id)));
}
function deleteMatch(id){
  saveAll(loadAll().filter(m=>m.id!==id));
  renderMatchLists();
}

/* ================= STARTSKÄRM ================= */
function buildStart(){
  const list = $("formList");
  list.innerHTML = "";
  FORMS.forEach(f=>{
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<div class="head"><span class="name">${f.name}</span><span class="age">${f.age}</span></div>`;
    const vs = document.createElement("div");
    vs.className = "variants";
    f.variants.forEach(v=>{
      const b = document.createElement("button");
      b.className = "variant";
      b.innerHTML = `<span class="time">${v.periods} × ${v.min} min</span><span class="label">${v.label}</span>`;
      b.onclick = ()=> startMatch(f, v);
      vs.appendChild(b);
    });
    card.appendChild(vs);
    list.appendChild(card);
  });
}

function startMatch(form, variant){
  cfg = { name: form.name, label: variant.label, periods: variant.periods, min: variant.min,
          age: form.age, info: form.info };
  period = 1; elapsed = 0; running = false; alarmFired = false; matchOver = false;
  home = 0; away = 0;
  currentId = Date.now(); createdAt = currentId;
  resetColors();
  $("formName").textContent = `${cfg.name} · ${cfg.periods} × ${cfg.min} min`;
  buildSegs();
  showScreen("match");
  render();
  saveCurrent();
}

function resumeMatch(id){
  const m = loadAll().find(x=>x.id===id);
  if(!m) return;
  initAudio(); // knapptryckning = tillfälle att aktivera ljudet
  currentId = m.id; createdAt = m.createdAt;
  cfg = m.cfg; period = m.period; elapsed = m.elapsed;
  alarmFired = m.alarmFired; matchOver = m.matchOver;
  home = m.home; away = m.away;
  resetColors();
  if(m.colors){
    if(m.colors.home) applyColor("home", m.colors.home);
    if(m.colors.away) applyColor("away", m.colors.away);
  }
  $("formName").textContent = `${cfg.name} · ${cfg.periods} × ${cfg.min} min`;
  buildSegs();
  showScreen("match");
  const target = cfg.min*60;
  if(m.running && !alarmFired && !matchOver){
    // Klockan gick när appen stängdes – räkna med tiden som passerat i verkligheten
    elapsed = elapsed + (Date.now() - m.savedAt)/1000;
    if(elapsed >= target){
      elapsed = target;
      render();
      fireAlarm(); // perioden hann ta slut medan appen var stängd
      saveCurrent();
      return;
    }
    startClock();
  } else {
    running = false;
    render();
  }
  saveCurrent();
}

function renderMatchLists(){
  const wrap = $("matchLists");
  wrap.innerHTML = "";
  const list = loadAll();
  const sections = [
    ["Pågående matcher", list.filter(m=>!m.matchOver), true],
    ["Tidigare matcher",  list.filter(m=>m.matchOver),  false],
  ];
  sections.forEach(([title, items, isOngoing])=>{
    if(!items.length) return;
    const sec = document.createElement("div");
    sec.className = "mh-section";
    sec.innerHTML = `<div class="mh-title">${title}</div>`;
    items.forEach(m=>{
      const row = document.createElement("div");
      row.className = "mrow" + (isOngoing ? " ongoing" : "");
      let el = m.elapsed;
      if(isOngoing && m.running && !m.alarmFired){
        el = Math.min(m.cfg.min*60, el + (Date.now()-m.savedAt)/1000);
      }
      const meta = isOngoing
        ? `Period ${m.period} av ${m.cfg.periods} · ${fmt(el)} · ${m.home}–${m.away} · ${fmtDate(m.savedAt)}`
        : `Slutresultat ${m.home}–${m.away} · ${fmtDate(m.savedAt)}`;
      row.innerHTML = `<div class="minfo">
          <div class="mname">${m.cfg.name} <span style="font-weight:500;color:var(--dim)">${m.cfg.label}</span></div>
          <div class="mmeta">${meta}</div>
        </div>`;
      if(isOngoing){
        const b = document.createElement("button");
        b.className = "mbtn resume";
        b.textContent = "Fortsätt";
        b.onclick = ()=> resumeMatch(m.id);
        row.appendChild(b);
      }
      const d = document.createElement("button");
      d.className = "mbtn del";
      d.textContent = "🗑";
      d.title = "Ta bort matchen";
      d.onclick = ()=>{
        if(confirm(`Ta bort matchen ${m.cfg.name} (${m.home}–${m.away})? Det går inte att ångra.`)){
          deleteMatch(m.id);
        }
      };
      row.appendChild(d);
      sec.appendChild(row);
    });
    wrap.appendChild(sec);
  });
}

function resetColors(){
  teamHex = {home:null, away:null};
  ["home","away"].forEach(side=>{
    const card = $(side==="home" ? "homeTeam" : "awayTeam");
    card.style.borderTopColor = "";
    const tn = card.querySelector(".tname");
    tn.style.color = ""; tn.style.textShadow = "";
    const sp = card.querySelector(".shirtpath");
    if(sp) sp.setAttribute("fill", "#3A4C61");
  });
}

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active");
}

/* ================= MATCHSKÄRM ================= */
function buildSegs(){
  const wrap = $("periodSegs");
  wrap.innerHTML = "";
  for(let i=1;i<=cfg.periods;i++){
    const seg = document.createElement("div");
    seg.className = "pseg";
    seg.innerHTML = `<div class="fill"></div>`;
    wrap.appendChild(seg);
  }
}

function render(){
  const target = cfg.min*60;
  const over = elapsed > target;

  // Klocka
  const clock = $("clock");
  clock.textContent = over ? "+"+fmt(elapsed-target) : fmt(elapsed);
  clock.className = "clock" + (running ? (over?" overtime":" running") : "");
  $("clockSub").textContent = over
    ? `Full tid ${fmt(target)} har passerats`
    : `av ${fmt(target)}`;

  // Periodsegment
  document.querySelectorAll(".pseg").forEach((seg,i)=>{
    const p = i+1;
    seg.classList.toggle("done", p < period || matchOver);
    seg.classList.toggle("overtime", p===period && over && !matchOver);
    const fill = seg.querySelector(".fill");
    fill.style.width = (p<period||matchOver) ? "100%" :
                       (p===period ? Math.min(100, elapsed/target*100)+"%" : "0");
  });
  $("periodLabel").textContent = matchOver
    ? "Matchen är slut"
    : `Period ${period} av ${cfg.periods}`;

  // Mål
  $("homeGoals").textContent = home;
  $("awayGoals").textContent = away;

  // Huvudknapp
  const b = $("btnMain");
  if(matchOver){
    b.textContent = "Ny match";
    b.className = "bigbtn start";
  } else if(running){
    b.textContent = "Pausa";
    b.className = "bigbtn pause";
  } else if(alarmFired){
    b.textContent = (period < cfg.periods) ? `Starta period ${period+1}` : "Avsluta matchen";
    b.className = "bigbtn start";
  } else {
    b.textContent = elapsed>0 ? "Fortsätt" : `Starta period ${period}`;
    b.className = "bigbtn start";
  }
}

/* ================= KLOCKA ================= */
function tick(){
  const now = Date.now();
  elapsed += (now - lastTs)/1000;   // klarar att fliken/telefonen strular en stund
  lastTs = now;
  const target = cfg.min*60;
  if(!alarmFired && elapsed >= target){
    elapsed = target;
    fireAlarm();
  }
  if(now - lastSaveTs > 3000){ lastSaveTs = now; saveCurrent(); }
  render();
}

function startClock(){
  running = true;
  lastTs = Date.now();
  tickTimer = setInterval(tick, 250);
  requestWakeLock();
  render();
  saveCurrent();
}
function stopClock(){
  running = false;
  clearInterval(tickTimer);
  render();
  saveCurrent();
}

function mainButton(){
  initAudio(); // måste skapas vid en knapptryckning (krav i iOS/Android)
  if(matchOver){ renderMatchLists(); showScreen("start"); return; }
  if(running){ stopClock(); return; }
  if(alarmFired){
    // Gå vidare till nästa period eller avsluta
    if(period < cfg.periods){
      period++; elapsed = 0; alarmFired = false;
      startClock();
    } else {
      matchOver = true;
      releaseWakeLock();
      render();
      saveCurrent(); // sparas som avslutad i historiken
    }
    return;
  }
  startClock();
}

/* ================= LARM ================= */
function initAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  }
  if(audioCtx.state === "suspended") audioCtx.resume();
}

function beep(){
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  // Två toner som en domarvissla: kraftigt och skarpt
  [ [2100, 0, .35], [2800, 0, .35], [2100, .45, .35], [2800, .45, .35] ].forEach(([f,delay,dur])=>{
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "square";
    o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t+delay);
    g.gain.exponentialRampToValueAtTime(0.5, t+delay+.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+delay+dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t+delay); o.stop(t+delay+dur+.05);
  });
  if(navigator.vibrate) navigator.vibrate([400,150,400]);
}

function fireAlarm(){
  alarmFired = true;
  stopClock();
  if(typeof setLocked==="function" && locked) setLocked(false); // lås upp så larmet kan stängas av
  const last = period >= cfg.periods;
  $("alarmTitle").textContent = last ? "Full tid!" : `Period ${period} är slut!`;
  $("alarmSub").textContent = last
    ? `Slutresultat ${home} – ${away}`
    : `Ställning ${home} – ${away} · Nästa: period ${period+1}`;
  $("alarmOverlay").classList.add("active");
  beep();
  alarmTimer = setInterval(beep, 1400); // upprepa tills man stänger av
  saveCurrent();
}

$("btnDismiss").onclick = ()=>{
  clearInterval(alarmTimer);
  if(navigator.vibrate) navigator.vibrate(0);
  $("alarmOverlay").classList.remove("active");
  render();
  saveCurrent();
};

/* ================= MÅL ================= */
$("homeTeam").onclick = e=>{ if(e.target.id!=="homeMinus"){ home++; render(); saveCurrent(); } };
$("awayTeam").onclick = e=>{ if(e.target.id!=="awayMinus"){ away++; render(); saveCurrent(); } };
$("homeMinus").onclick = e=>{ e.stopPropagation(); if(home>0) home--; render(); saveCurrent(); };
$("awayMinus").onclick = e=>{ e.stopPropagation(); if(away>0) away--; render(); saveCurrent(); };

/* ================= LAGFÄRGER ================= */
const KIT_COLORS = [
  ["Vit","#F5F7F4"], ["Svart","#111418"], ["Röd","#E5484D"], ["Blå","#2F6FED"],
  ["Gul","#FFD60A"], ["Grön","#35C46A"], ["Orange","#FF8A2A"], ["Lila","#9A5CF5"]
];
const SHIRT_D = "M7.5 2 L2.5 4.5 L1 8.5 L4.5 10 L4.5 22 L19.5 22 L19.5 10 L23 8.5 L21.5 4.5 L16.5 2 C16 3.8 14.2 5 12 5 C9.8 5 8 3.8 7.5 2 Z";
function shirtSVG(hex){
  return `<svg viewBox="0 0 24 24"><path class="shirtpath" d="${SHIRT_D}" fill="${hex}" stroke="#8FA0B3" stroke-width="1.1" stroke-linejoin="round"/></svg>`;
}
let pickingFor = null; // "home" | "away"

function openPalette(side){
  pickingFor = side;
  $("paletteTitle").textContent = side==="home" ? "Tröjfärg – Hemma" : "Tröjfärg – Borta";
  $("colorModal").classList.add("active");
}
function applyColor(side, hex){
  teamHex[side] = hex;
  const card = $(side==="home" ? "homeTeam" : "awayTeam");
  card.style.borderTopColor = hex;
  card.querySelector(".tname").style.color = hex;
  // Svart syns dåligt mot mörk bakgrund – ge namnet en ljus kant i det fallet
  card.querySelector(".tname").style.textShadow =
    (hex==="#111418") ? "0 0 6px rgba(245,247,244,.8)" : "none";
  // Färga tröj-ikonen på knappen
  card.querySelector(".shirtpath").setAttribute("fill", hex);
}
// Rita tröjknapparna (grå tröja = ingen färg vald ännu)
$("homeColor").innerHTML = shirtSVG("#3A4C61");
$("awayColor").innerHTML = shirtSVG("#3A4C61");

(function buildSwatches(){
  const wrap = $("swatches");
  KIT_COLORS.forEach(([name,hex])=>{
    const b = document.createElement("button");
    b.className = "swatch";
    b.title = name;
    b.innerHTML = shirtSVG(hex);
    b.onclick = ()=>{
      applyColor(pickingFor, hex);
      $("colorModal").classList.remove("active");
      saveCurrent();
    };
    wrap.appendChild(b);
  });
})();
$("homeColor").onclick = e=>{ e.stopPropagation(); openPalette("home"); };
$("awayColor").onclick = e=>{ e.stopPropagation(); openPalette("away"); };
$("colorModal").onclick = e=>{ if(e.target.id==="colorModal") $("colorModal").classList.remove("active"); };

/* ================= LÅSLÄGE =================
   Låser alla tryck på skärmen. Dra reglaget åt höger för att låsa upp,
   som ett vanligt skärmlås. */
let locked = false;

function setLocked(v){
  locked = v;
  $("lockOverlay").classList.toggle("active", v);
  resetKnob();
}
$("lockBtn").onclick = ()=> setLocked(true);

const knob = $("slideKnob"), track = $("slideTrack");
let dragId = null, grabX = 0;
const KNOB_MIN = 5;
function knobMax(){ return track.clientWidth - knob.offsetWidth - KNOB_MIN; }
function resetKnob(){ knob.classList.add("snap"); knob.style.left = KNOB_MIN+"px"; }

knob.addEventListener("pointerdown", e=>{
  e.preventDefault();
  dragId = e.pointerId;
  grabX = e.clientX - knob.offsetLeft;
  knob.classList.remove("snap");
  knob.setPointerCapture(dragId);
});
knob.addEventListener("pointermove", e=>{
  if(dragId !== e.pointerId) return;
  const x = Math.max(KNOB_MIN, Math.min(knobMax(), e.clientX - grabX));
  knob.style.left = x+"px";
});
knob.addEventListener("pointerup", e=>{
  if(dragId !== e.pointerId) return;
  dragId = null;
  if(knob.offsetLeft >= knobMax()*0.85){
    setLocked(false);           // hela vägen fram = upplåst
  } else {
    resetKnob();                // annars glider knoppen tillbaka
  }
});
knob.addEventListener("pointercancel", ()=>{ dragId = null; resetKnob(); });

/* ================= REGELINFO ================= */
$("infoBtn").onclick = ()=>{
  $("infoTitle").textContent = cfg.name;
  $("infoSub").textContent = `${cfg.age} · ${cfg.periods} × ${cfg.min} min (${cfg.label})`;
  const list = $("infoList");
  list.innerHTML = "";
  cfg.info.forEach(([label, text])=>{
    const r = document.createElement("div");
    r.className = "irow";
    r.innerHTML = `<div class="ilabel">${label}</div><div class="itext">${text}</div>`;
    list.appendChild(r);
  });
  $("infoModal").classList.add("active");
};
$("infoClose").onclick = ()=> $("infoModal").classList.remove("active");
$("infoModal").onclick = e=>{ if(e.target.id==="infoModal") $("infoModal").classList.remove("active"); };

/* ================= ÖVRIGT ================= */
$("btnMain").onclick = mainButton;
$("btnBack").onclick = ()=>{
  // Matchen slängs aldrig – den sparas och kan fortsättas från startsidan.
  // Går klockan när man lämnar fortsätter tiden att räknas i bakgrunden.
  saveCurrent();
  clearInterval(tickTimer);
  clearInterval(alarmTimer);
  $("alarmOverlay").classList.remove("active");
  releaseWakeLock();
  renderMatchLists();
  showScreen("start");
};

/* Håll skärmen tänd under match */
async function requestWakeLock(){
  try{
    if("wakeLock" in navigator){
      wakeLock = await navigator.wakeLock.request("screen");
    }
  }catch(e){/* vissa webbläsare stödjer inte – klockan går ändå */}
}
function releaseWakeLock(){
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; }
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="hidden"){
    // Appen läggs i bakgrunden eller stängs – spara direkt!
    saveCurrent();
    return;
  }
  // Om skärmen släckts och tänds igen: återta wake lock och synka klockan
  if(running){
    requestWakeLock();
    tick(); // synka direkt – tid som gått medan skärmen var släckt räknas med
  }
  checkForUpdate(); // passa på att kolla om det finns en ny version
});

/* ================= UPPDATERINGSKOLL =================
   Hämtar en färsk kopia av sidan (förbi cachen) och läser av
   versionsnumret. Skiljer det sig visas en knapp på startskärmen. */
$("verLabel").textContent = "Version " + APP_VERSION;

async function checkForUpdate(){
  try{
    const res = await fetch(location.pathname + "?u=" + Date.now(), {cache:"no-store"});
    if(!res.ok) return;
    const txt = await res.text();
    const m = txt.match(/APP_VERSION\s*=\s*"([^"]+)"/);
    if(m && m[1] !== APP_VERSION){
      const b = $("updateBanner");
      b.textContent = `Ny version ${m[1]} finns – tryck här för att uppdatera`;
      b.hidden = false;
    }
  }catch(e){ /* offline – försök igen nästa gång appen öppnas */ }
}
$("updateBanner").onclick = ()=>{
  // ?v=... tvingar telefonen att hämta sidan på nytt istället för ur cachen
  location.href = location.pathname + "?v=" + Date.now();
};
checkForUpdate();

buildStart();
renderMatchLists();
</script>
