name: Bygg Android-APK

# Bygger en installerbar APK vid varje push till main,
# och när du startar bygget manuellt under fliken "Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Installera Java (krävs av Android-bygget)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Installera projektets paket
        run: npm ci

      - name: Kopiera webbfilerna till Android-projektet
        run: npx cap sync android

      - name: Bygg APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - name: Ladda upp APK-filen
        uses: actions/upload-artifact@v4
        with:
          name: domarklockan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
