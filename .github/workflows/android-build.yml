name: Bygg och publicera Domarklockan

# Bygger appen vid varje push till main och publicerar APK:n som en
# GitHub Release. Versionsnumret hämtas automatiskt ur docs/index.html.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Läs versionsnumret ur appen
        id: ver
        run: |
          VERSION=$(grep -oP 'APP_VERSION\s*=\s*"\K[^"]+' docs/index.html | head -1)
          if [ -z "$VERSION" ]; then echo "Hittade inget APP_VERSION"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Installera Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Installera Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Installera projektets paket
        run: npm ci

      - name: Generera app-ikoner
        run: npx @capacitor/assets generate --android

      - name: Kopiera webbfilerna till Android-projektet
        run: npx cap sync android

      - name: Bygg APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - name: Namnge APK:n
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Domarklockan.apk
          cp dist/Domarklockan.apk "dist/Domarklockan-v${{ steps.ver.outputs.version }}.apk"

      - name: Spara som artefakt
        uses: actions/upload-artifact@v4
        with:
          name: Domarklockan-v${{ steps.ver.outputs.version }}
          path: dist/Domarklockan.apk
          if-no-files-found: error

      # Skapar en release med taggen v<version>. Finns taggen redan
      # (dvs. versionen är oförändrad) ersätts filerna i stället.
      - name: Publicera release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V finns redan - ersatter filerna."
            gh release upload "v$V" dist/Domarklockan.apk "dist/Domarklockan-v$V.apk" --clobber
          else
            printf 'Ladda ner **Domarklockan.apk** och oppna filen pa telefonen for att installera.\n\nSenaste versionen finns alltid har:\nhttps://github.com/%s/releases/latest/download/Domarklockan.apk\n' "$REPO" > notes.md
            gh release create "v$V" \
              dist/Domarklockan.apk "dist/Domarklockan-v$V.apk" \
              --title "Domarklockan v$V" \
              --notes-file notes.md
          fi
